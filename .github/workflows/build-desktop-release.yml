name: Build-Logseq-Arabic-RTL

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Branch or Tag to build"
        required: true
        default: "full-rtl-test-only"
      build-android:
        description: 'Build Android App'
        type: boolean
        required: true
        default: true

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22.20.0'
  JAVA_VERSION: '17'

jobs:
  build-electron:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}
          submodules: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@master
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Electron App
        env:
          LOGSEQ_CI: true
        run: |
          # بناء ملفات الـ JS المطلوبة
          npx shadow-cljs release db-worker inference-worker
          npx shadow-cljs release app
          # بناء الـ CSS
          yarn gulp:build
          # تجميع Webpack
          npx webpack build --mode production --config-name app
          # بناء حزمة الإلكترون
          yarn gulp electronMaker

      - name: Locate and Prepare AppImage
        run: |
          echo "جاري البحث عن ملف AppImage..."
          # البحث في كل المجلدات ونقله للمجلد الحالي لسهولة الرفع
          find . -name "*.AppImage" -exec cp {} ./logseq-linux.AppImage \;
          if [ -f ./logseq-linux.AppImage ]; then
            echo "تم العثور على الملف بنجاح."
          else
            echo "خطأ: لم يتم العثور على ملف AppImage. قائمة الملفات في المجلدات الناتجة:"
            ls -R static/out || true
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-linux-appimage
          path: logseq-linux.AppImage

  build-android:
    name: Build Android App
    if: ${{ github.event.inputs.build-android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}
          submodules: true

      # إصلاح خطأ إصدار Node في الأندرويد
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Android Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Debug APK
        run: |
          yarn install --frozen-lockfile
          npx shadow-cljs release mobile
          cd static && ./gradlew assembleDebug

      - name: Locate and Prepare APK
        run: |
          echo "جاري البحث عن ملف APK..."
          find static/app/build/outputs/apk -name "*.apk" -exec cp {} ./logseq-android.apk \;
          if [ -f ./logseq-android.apk ]; then
            echo "تم العثور على APK بنجاح."
          else
            echo "خطأ: لم يتم العثور على APK."
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-android-apk
          path: logseq-android.apk

  create-release:
    name: Create GitHub Release
    needs: [build-electron, build-android]
    # يضمن التشغيل حتى لو فشل بناء الأندرويد مثلاً بشرط نجاح الإلكترون
    if: always() && (needs.build-electron.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Organize Files for Release
        run: |
          # تجميع كل الملفات من المجلدات الفرعية إلى المجلد الرئيسي
          find ./artifacts -name "*.AppImage" -exec cp {} . \;
          find ./artifacts -name "*.apk" -exec cp {} . \;
          
          # إنشاء ملف البصمة الأمنية للملفات الموجودة
          sha256sum *.AppImage *.apk > SHA256SUMS.txt || echo "فشل إنشاء ملف SHA256"

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release-${{ github.run_number }}"
          name: "Logseq Arabic RTL Build #${{ github.run_number }}"
          body: "بناء تجريبي للنسخة العربية (RTL). يشمل AppImage و APK."
          draft: true
          files: |
            *.AppImage
            *.apk
            SHA256SUMS.txt
