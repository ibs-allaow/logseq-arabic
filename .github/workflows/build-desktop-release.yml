name: Build-Desktop-Release

on:
  workflow_dispatch:
    inputs:
      build-target:
        description: 'Build Target (Release Type)'
        type: choice
        required: true
        options:
          - beta
          - nightly
          - non-release
        default: "non-release"
      git-ref:
        description: "Release Git Ref (Which branch or tag to build?)"
        required: true
        default: "master"
      is-draft:
        description: 'Draft Release? (Beta only, Nightly will always be a non-draft)'
        type: boolean
        required: true
        default: true
      is-pre-release:
        description: 'Pre Release? (labeled as "PreRelease")'
        type: boolean
        required: true
        default: true
      enable-file-sync-production:
        description: 'File sync production mode'
        type: boolean
        required: true
        default: true
      enable-plugins:
        description: 'Build with plugin system support'
        type: boolean
        required: true
        default: true
      build-android:
        description: 'Build Android App'
        type: boolean
        required: true
        default: true

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '20.11.1'
  JAVA_VERSION: '17'

jobs:
  build-electron:
    name: Build Electron App (Linux x64 Only)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4  # تم التحديث لـ v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Set up JDK 17
        uses: actions/setup-java@v4  # تم التحديث لـ v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@12.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Logseq App
        env:
          start_of_week: :monday
          LOGSEQ_CI: true
          ENABLE_FILE_SYNC: ${{ inputs.enable-file-sync-production }}
          ENABLE_PLUGINS: ${{ inputs.enable-plugins }}
        run: |
          yarn release-electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4  # تم التحديث لـ v4 (حل المشكلة)
        with:
          name: logseq-linux-builds
          path: |
            static/out/*
            !static/out/*-unpacked
          compression-level: 0 # اختياري: لتسريع الرفع بما أن الملفات مضغوطة أصلاً

  build-android:
    if: ${{ inputs.build-android == 'true' }}
    name: Build Android App (Unsigned/Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4  # تم التحديث لـ v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'
          cache: 'gradle'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Android APK
        env:
          LOGSEQ_CI: true
          ENABLE_FILE_SYNC: ${{ inputs.enable-file-sync-production }}
          ENABLE_PLUGINS: ${{ inputs.enable-plugins }}
        run: |
          cd ./src/main/frontend/
          yarn install
          npx shadow-cljs release app
          cd ../../../
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4  # تم التحديث لـ v4 (حل المشكلة)
        with:
          name: logseq-android-builds
          path: ./android/app/build/outputs/apk/debug/*.apk
          compression-level: 0

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-electron, build-android]
    if: ${{ !cancelled() }} 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4  # تم التحديث لـ v4 (حل المشكلة)
        with:
          name: logseq-linux-builds
          path: ./

      - name: Download Android Artifacts
        if: ${{ inputs.build-android == 'true' }}
        uses: actions/download-artifact@v4  # تم التحديث لـ v4 (حل المشكلة)
        with:
          name: logseq-android-builds
          path: ./

      - name: Retrieve tag version
        id: ref
        run: |
          if [ -f VERSION ]; then
            pkgver=$(cat VERSION)
          else
            pkgver="custom-build"
          fi
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksums
        run: |
          # v4 قد يضع الملفات داخل مجلدات، نقوم بنقلها للجذر إذا لزم الأمر أو فحصها مباشرة
          # الأمر التالي يبحث عن الملفات في المجلد الحالي
          sha256sum *-linux-* > SHA256SUMS.txt || true
          sha256sum *.apk >> SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.ref.outputs.version }}
          name: Logseq Custom Build ${{ steps.ref.outputs.version }}
          body: "Custom build: Linux x64 and Android (Unsigned/Debug). Fixed Actions v4."
          draft: ${{ inputs.is-draft }}
          prerelease: ${{ inputs.is-pre-release }}
          files: |
            *.AppImage
            *.deb
            *.rpm
            *.apk
            SHA256SUMS.txt
