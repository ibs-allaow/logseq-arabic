name: Build - Linux x64 + Android (no Sentry, unsigned APK)

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Branch or commit to build"
        required: true
        default: "master"

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  # 1) compile CLJS and prepare static artifact
  compile-cljs:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache dir
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@10.1
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install JS deps & build UI + CLJS (release builds used for desktop + android)
        run: |
          yarn install
          yarn ui:build || true
          # build UI then full frontend release (adjust commands if your repo uses different scripts)
          gulp build || true
          # release app / electron assets and webpack build
          yarn cljs:release || true
          yarn webpack-app-build || true
        env:
          # keep these empty in forks; removed Sentry step anyway
          LOGSEQ_SENTRY_DSN: ""

      - name: Get package version
        id: get-version
        run: |
          if [ -f static/VERSION ]; then
            ver=$(cat static/VERSION)
          else
            # fallback: try node script
            ver=$(node ./scripts/get-pkg-version.js "non-release" || echo "dev")
          fi
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: static
          path: static

  # 2) Build Linux x64 (AppImage + zip) using static artifact
  build-linux-x64:
    runs-on: ubuntu-22.04
    needs: compile-cljs
    steps:
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Checkout (to have repo files like package.json etc)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache dir
        id: yarn-cache-dir-path-2
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path-2.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Build desktop (Linux x64)
        working-directory: static
        run: |
          # install deps for electron builder
          yarn install --ignore-scripts=false
          # optional: rebuild native deps if needed
          yarn rebuild:all || true
          # create linux x64 AppImage / zip via electron-maker script (project must support this)
          # using `yarn electron:make` (adjust if your repo uses a different script)
          yarn electron:make -- --platform=linux --arch=x64 || yarn electron:make || true

      - name: Collect Linux artifacts
        run: |
          mkdir -p builds
          # try AppImage first
          appimage=$(find static/out/make -type f -name "*.AppImage" -print -quit || true)
          if [ -n "$appimage" ]; then
            mv "$appimage" builds/Logseq-linux-x64-${{ needs.compile-cljs.outputs.version }}.AppImage
          fi
          # also collect zip if exists
          zipf=$(find static/out/make -type f -name "*-linux-x64-*.zip" -print -quit || true)
          if [ -n "$zipf" ]; then
            mv "$zipf" builds/Logseq-linux-x64-${{ needs.compile-cljs.outputs.version }}.zip
          fi
          ls -al builds || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logseq-linux-x64-builds
          path: builds

  # 3) Build Android (unsigned APK) using the same static artifact
  build-android:
    runs-on: ubuntu-22.04
    needs: compile-cljs
    steps:
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: static
          path: static

      - name: Checkout (repo files)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Ensure Gradle uses Java 17 (fix invalid source release: 21)
        run: |
          # Gradle property forcing runner Java
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties

      - name: Prepare public for Android
        run: |
          cp -r static public/
          rm -rf public/static/js/publishing || true
          rm -f public/static/js/*.js.map || true
          rm -rf public/static/ios || true
          rm -rf public/static/* || true
          rm -rf android/app/src/main/assets/public || true

      - name: Sync public to Android Project
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Build Android (zipApksForRelease)
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew zipApksForRelease

      - name: Collect unsigned APK
        run: |
          mkdir -p builds
          unsigned=$(find android/app/build/outputs -type f -name "*unsigned*.apk" -print -quit)
          if [ -z "$unsigned" ]; then
            echo "No unsigned APK found; listing outputs for debug:"
            ls -R android/app/build/outputs || true
            exit 1
          fi
          mv "$unsigned" ./builds/Logseq-android-${{ needs.compile-cljs.outputs.version }}-unsigned.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-android-builds
          path: builds
