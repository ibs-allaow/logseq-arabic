name: Build-Logseq-Arabic-RTL

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Branch or Tag to build"
        required: true
        default: "full-rtl-test-only"
      build-android:
        description: 'Build Android App'
        type: boolean
        required: true
        default: true

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22.20.0'
  JAVA_VERSION: '17'

jobs:
  build-electron:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}
          submodules: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@master
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Electron App
        env:
          LOGSEQ_CI: true
        run: |
          npx shadow-cljs release db-worker inference-worker
          npx shadow-cljs release app
          yarn gulp:build
          npx webpack build --mode production --config-name app
          # تشغيل البناء وتخزين المخرجات في سجل للتأكد
          yarn gulp electronMaker

      - name: Locate and Move AppImage
        run: |
          echo "Searching for AppImage files..."
          # البحث عن أي ملف AppImage ونسخه للمجلد الحالي باسم واضح
          find . -name "*.AppImage" -exec cp {} ./logseq-build.AppImage \;
          
          # فحص المجلدات الناتجة إذا لم نجد AppImage (للتشخيص)
          if [ ! -f ./logseq-build.AppImage ]; then
            echo "AppImage NOT FOUND! Listing all files in static/out:"
            ls -R static/out || echo "static/out does not exist"
            ls -R dist || echo "dist does not exist"
            exit 1 # إفشال العملية هنا لنعرف السبب قبل الرفع
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-linux-appimage
          path: logseq-build.AppImage

       if-no-files-found: error # سيجعل العملية تفشل بوضوح إذا لم يجد الملف

  build-android:
    name: Build Android App
    if: ${{ github.event.inputs.build-android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}
          submodules: true

      - name: Setup Android Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Debug APK
        run: |
          yarn install
          npx shadow-cljs release mobile
          cd static && ./gradlew assembleDebug

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-android-apk
          path: static/app/build/outputs/apk/debug/*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-electron, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: Organize Files
        run: |
          # تجميع ملفات الـ AppImage والـ APK في المجلد الرئيسي للرفع
          find ./all-artifacts -name "*.AppImage" -exec cp {} . \;
          find ./all-artifacts -name "*.apk" -exec cp {} . \;
          
          # إنشاء ملف الفحص الأمني (بشرط وجود ملفات)
          sha256sum *.AppImage *.apk > SHA256SUMS.txt || echo "No files to hash" > SHA256SUMS.txt

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Logseq Arabic RTL v${{ github.run_number }}"
          body: "تم بناء هذه النسخة آلياً للتجربة. تشمل AppImage للينكس و APK للأندرويد."
          draft: true
          prerelease: true
          files: |
            *.AppImage
            *.apk
            SHA256SUMS.txt
